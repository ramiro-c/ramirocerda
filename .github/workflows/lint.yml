# Repo-wide lint gate (oxlint). Blocks PRs and pushes to main on lint errors;
# style warnings are visible but non-blocking.
name: lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run lint

# Kept as a standalone workflow instead of a step inside site-links.yml: lint
# gates the whole repo (site, worker, scripts) and runs without a site build.
