# Repo-wide code-quality gate. Both checks block PRs and pushes to main:
# oxlint reports correctness/suspicious findings, Prettier owns layout.
# Kept as a standalone workflow instead of a step inside site-links.yml: this
# gates the whole repo (site, worker, scripts) and runs without a site build.
name: lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run format:check
