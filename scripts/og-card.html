<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>OG Image Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background-color: #000000;
        display: flex;
        flex-direction: column;
        font-family:
          "Geist",
          system-ui,
          -apple-system,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #ffffff;
      }

      .canvas {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px 56px;
        position: relative;
      }

      .canvas::before {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 60%;
        height: 100%;
        background: radial-gradient(ellipse 75% 65% at 100% 15%, rgba(228, 87, 46, 0.14) 0%, transparent 62%);
        pointer-events: none;
      }

      .hero {
        position: relative;
        z-index: 1;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        max-width: 960px;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
        font-size: 15px;
        line-height: 22px;
        font-weight: 500;
        color: #8a8a8a;
      }

      .eyebrow-rule {
        width: 48px;
        height: 1px;
        background-color: #e4572e;
        flex: none;
      }

      .hero-title {
        margin-bottom: 32px;
        font-size: 68px;
        line-height: 1.02;
        font-weight: 600;
        letter-spacing: -0.035em;
        background-image: linear-gradient(90deg, #ffffff 0%, #9b9b9b 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .hero-line {
        display: block;
      }

      .hero-sub {
        font-size: 20px;
        line-height: 32px;
        font-weight: 400;
        color: #b4b4b4;
        max-width: 720px;
      }

      .footer-mark {
        position: relative;
        z-index: 1;
        padding-top: 32px;
        border-top: 1px solid #272727;
        font-size: 13px;
        line-height: 18px;
        font-weight: 500;
        color: #8a8a8a;
        font-family: "Geist Mono", ui-monospace, monospace;
        letter-spacing: -0.02em;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="hero">
        <div class="eyebrow">
          <span class="eyebrow-rule" aria-hidden="true"></span>
          Tech lead y desarrollador full stack
        </div>
        <h1 class="hero-title">
          <span class="hero-line">Pienso el producto</span>
          <span class="hero-line">y lo pongo en producción.</span>
        </h1>
        <p class="hero-sub">
          Tech lead y desarrollador full stack. Diseño, desarrollo y mantengo productos web, móviles y agentes de IA. Me
          quedo en cada proyecto hasta que funciona con usuarios reales.
        </p>
      </div>

      <div class="footer-mark">ramirocerda.com.ar</div>
    </div>
  </body>
</html>
