# Build the Astro site and check every link in the output (es and en).
# Broken internal links always fail the job, on every trigger.
# External links are only fetched on the weekly schedule and on manual dispatch:
# they are network-bound, slow and flaky, so they never gate a pull request.
# When fetched, 404, 410 and DNS failures fail the job; bot blocks
# (401, 403, 429), 5xx and timeouts only warn. See scripts/check-links.mjs
# for the allowlist.
name: site links

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 12:00 UTC (09:00 Buenos Aires), to catch external links that rot.
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun test scripts/check-links.test.mjs scripts/site-stats.test.mjs src/scripts/botardo-offer.test.mjs src/scripts/botardo-stream.test.mjs

      - run: bun run build

      - name: Check internal links
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: bun run links

      - name: Check internal and external links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bun run links -- --external
