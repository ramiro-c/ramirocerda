# Run the Botardo chat-worker test suite on PRs/pushes that touch the worker.
# The site build itself is already gated by the Vercel preview check.
name: chat-worker tests

on:
  push:
    branches: [main]
    paths:
      - "workers/chat-worker/**"
      - "bun.lock"
      - ".github/workflows/chat-worker-tests.yml"
  pull_request:
    paths:
      - "workers/chat-worker/**"
      - "bun.lock"
      - ".github/workflows/chat-worker-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Merge-gate guard: catches a manifest committed with conflict markers
      # before the suite runs (JSON validity only — content drift is legit and
      # is resolved by the chat-worker populate workflow, not failed on here).
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('workers/chat-worker/vectorize-manifest.json','utf8'))"

      - run: bun install --frozen-lockfile --filter ramirocerda-chat-worker

      - run: bun run --filter ramirocerda-chat-worker typecheck

      - run: bun run --filter ramirocerda-chat-worker test
